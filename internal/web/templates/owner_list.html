{{define "content"}}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Owners</h1>
    <a class="btn btn-success" href="/owner/create">Add an owner</a>
</div>

<form action="/owner/list" method="get" class="row g-2 mb-3" role="search">
    <div class="col-sm-6 col-md-4">
        <label for="name" class="visually-hidden">Name</label>
        <input type="search" class="form-control" id="name" name="name" value="{{.Search}}" placeholder="Search by name">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
</form>

{{if not .Owners}}
<p class="text-body-secondary">No owners found.</p>
{{else}}
<div class="table-responsive">
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Phone</th>
            <th scope="col" class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        {{range .Owners}}
        <tr>
            <td>{{.Name}}</td>
            <td>{{.Email}}</td>
            <td>{{.Phone}}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" href="/owner/update/{{.ID}}">Edit</a>
                {{if $.User.IsAdmin}}
                <form action="/owner/delete/{{.ID}}" method="post" class="d-inline" onsubmit="return confirm('Delete this owner?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
                {{end}}
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>
{{end}}
{{end}}
