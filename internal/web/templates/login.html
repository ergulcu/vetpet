{{define "content"}}
<div class="form-signin">
    <form action="/login" method="post">
        <h1 class="h3 mb-3 text-center">Log in</h1>
        {{if .LoginFailed}}<div class="alert alert-danger">Invalid username or password.</div>{{end}}
        {{if .LoggedOut}}<div class="alert alert-info">You have been logged out.</div>{{end}}
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <div class="mt-4 text-center text-body-secondary small">
        <p class="mb-1">Demo accounts</p>
        <p class="mb-1"><code>admin</code> can delete records</p>
        <p class="mb-0"><code>user</code> cannot delete</p>
    </div>
</div>
{{end}}
