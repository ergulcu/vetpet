<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Owners')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('owners')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Owners</h1>
        <a class="btn btn-success" th:href="@{/owner/create}">Add an owner</a>
    </div>

    <form th:action="@{/owner/list}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-sm-6 col-md-4">
            <label for="name" class="visually-hidden">Name</label>
            <input type="search" class="form-control" id="name" name="name" th:value="${name}" placeholder="Search by name">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(owners)}" class="text-body-secondary">No owners found.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(owners)}">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="owner : ${owners}">
                <td th:text="${owner.name}">Name</td>
                <td th:text="${owner.email}">Email</td>
                <td th:text="${owner.phone}">Phone</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/owner/update/{id}(id=${owner.id})}">Edit</a>
                    <form th:if="${isAdmin}" th:action="@{/owner/delete/{id}(id=${owner.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this owner?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
