<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New owner')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('owners')}"></nav>
<main class="container" style="max-width: 40rem">
    <h1 class="h3 mb-3">New owner</h1>
    <form th:action="@{/owner/create}" th:object="${owner}" method="post" novalidate>
        <th:block th:replace="~{owner/form :: fields}"></th:block>
        <button type="submit" class="btn btn-primary">Create owner</button>
        <a class="btn btn-link" th:href="@{/owner/list}">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
