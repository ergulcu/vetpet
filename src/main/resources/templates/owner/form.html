<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared by owner/create and owner/update. -->
<th:block th:fragment="fields">
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid" id="name">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" id="email">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" th:field="*{phone}" th:errorclass="is-invalid" id="phone">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>
</th:block>
</body>
</html>
