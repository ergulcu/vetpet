<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<main class="container py-5">
    <h1 class="h3" th:text="${status} + ' ' + ${error}">Error</h1>
    <p th:text="${message}">Something went wrong.</p>
    <a class="btn btn-primary" th:href="@{/}">Back to the list</a>
</main>
</body>
</html>
