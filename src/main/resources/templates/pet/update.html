<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit pet')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('pets')}"></nav>
<main class="container" style="max-width: 40rem">
    <h1 class="h3 mb-3">Edit pet</h1>
    <form th:action="@{/pet/update/{id}(id=${pet.id})}" th:object="${pet}" method="post" novalidate>
        <th:block th:replace="~{pet/form :: fields}"></th:block>
        <button type="submit" class="btn btn-primary">Update pet</button>
        <a class="btn btn-link" th:href="@{/pet/list}">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
