<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared by pet/create and pet/update. -->
<th:block th:fragment="fields">
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid" id="name">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="row">
        <div class="col-sm-6 mb-3">
            <label for="type" class="form-label">Type</label>
            <input type="text" class="form-control" th:field="*{type}" th:errorclass="is-invalid" id="type" placeholder="Dog, cat, bird...">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>
        <div class="col-sm-6 mb-3">
            <label for="kind" class="form-label">Kind</label>
            <input type="text" class="form-control" th:field="*{kind}" th:errorclass="is-invalid" id="kind" placeholder="Breed">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('kind')}" th:errors="*{kind}"></div>
        </div>
    </div>
    <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" min="0" max="100" class="form-control" th:field="*{age}" th:errorclass="is-invalid" id="age">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
    </div>
    <div class="mb-3">
        <label for="owner" class="form-label">Owner</label>
        <select class="form-select" th:field="*{owner}" th:errorclass="is-invalid" id="owner">
            <option value="">Select an owner</option>
            <option th:each="o : ${owners}" th:value="${o.id}" th:text="${o.name}">Owner</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}"></div>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" th:field="*{description}" th:errorclass="is-invalid" id="description" rows="3"></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>
</th:block>
</body>
</html>
