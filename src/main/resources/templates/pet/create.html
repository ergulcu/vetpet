<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New pet')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('pets')}"></nav>
<main class="container" style="max-width: 40rem">
    <h1 class="h3 mb-3">New pet</h1>
    <p class="alert alert-warning" th:if="${#lists.isEmpty(owners)}">
        There are no owners yet. <a th:href="@{/owner/create}">Add an owner</a> first.
    </p>
    <form th:action="@{/pet/create}" th:object="${pet}" method="post" novalidate>
        <th:block th:replace="~{pet/form :: fields}"></th:block>
        <button type="submit" class="btn btn-primary">Create pet</button>
        <a class="btn btn-link" th:href="@{/pet/list}">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
