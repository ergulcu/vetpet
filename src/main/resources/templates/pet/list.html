<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pets')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('pets')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Pets</h1>
        <a class="btn btn-success" th:href="@{/pet/create}">Add a pet</a>
    </div>

    <form th:action="@{/pet/list}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-sm-6 col-md-4">
            <label for="name" class="visually-hidden">Name</label>
            <input type="search" class="form-control" id="name" name="name" th:value="${name}" placeholder="Search by name">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(pets)}" class="text-body-secondary">No pets found.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(pets)}">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Kind</th>
                <th scope="col">Age</th>
                <th scope="col">Description</th>
                <th scope="col">Owner</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.name}">Name</td>
                <td th:text="${pet.type}">Type</td>
                <td th:text="${pet.kind}">Kind</td>
                <td th:text="${pet.age}">Age</td>
                <td th:text="${pet.description}">Description</td>
                <td th:text="${pet.owner.name}">Owner</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/pet/update/{id}(id=${pet.id})}">Edit</a>
                    <form th:if="${isAdmin}" th:action="@{/pet/delete/{id}(id=${pet.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this pet?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
